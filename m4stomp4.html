<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m4s 转 mp4 转换器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            background: #f8fafc;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2563eb;
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            color: #059669;
        }
        #download-area {
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
    <script src="coi-serviceworker.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>

<div class="container">
    <h1>m4s 转 mp4 工具</h1>
    <p style="font-size: 14px; color: #64748b;">支持将分离的音视频 m4s 文件合并为 MP4，或单文件直接封装为 MP4。处理过程完全在本地浏览器进行。</p>

    <div class="form-group">
        <label for="videoFile">上传视频文件 (video.m4s)</label>
        <input type="file" id="videoFile" accept=".m4s,.mp4">
    </div>

    <div class="form-group">
        <label for="audioFile">上传音频文件 (audio.m4s) - 可选</label>
        <input type="file" id="audioFile" accept=".m4s,.mp3,.aac">
    </div>

    <button id="startBtn" onclick="convert()">开始转换/合并</button>

    <div id="status"></div>

    <div id="download-area">
        <a id="downloadLink" class="download-btn" href="#" download="output.mp4">⬇️ 下载 MP4 文件</a>
    </div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    // 实例化 ffmpeg，开启日志以便在控制台查看进度
    const ffmpeg = createFFmpeg({ log: true });

    async function convert() {
        const videoInput = document.getElementById('videoFile').files[0];
        const audioInput = document.getElementById('audioFile').files[0];
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const downloadArea = document.getElementById('download-area');

        if (!videoInput && !audioInput) {
            alert('请至少上传一个 m4s 文件！');
            return;
        }

        try {
            startBtn.disabled = true;
            statusDiv.innerText = "正在加载 FFmpeg 核心引擎 (初次加载可能需要几秒钟)...";

            if (!ffmpeg.isLoaded()) {
                await ffmpeg.load();
            }

            let command = [];
            
            // 写入文件到内存文件系统
            if (videoInput) {
                statusDiv.innerText = "正在读取视频文件...";
                ffmpeg.FS('writeFile', 'video.m4s', await fetchFile(videoInput));
                command.push('-i', 'video.m4s');
            }
            if (audioInput) {
                statusDiv.innerText = "正在读取音频文件...";
                ffmpeg.FS('writeFile', 'audio.m4s', await fetchFile(audioInput));
                command.push('-i', 'audio.m4s');
            }

            // 设置输出编码 (复制流，不重新编码，速度极快)
            command.push('-c', 'copy');
            command.push('output.mp4');

            statusDiv.innerText = "正在转换 / 合并中，请稍候...";
            
            // 运行 ffmpeg 命令
            await ffmpeg.run(...command);

            statusDiv.innerText = "处理完成！正在生成下载链接...";

            // 从内存文件系统读取输出的 mp4
            const data = ffmpeg.FS('readFile', 'output.mp4');
            
            // 创建 Blob URL 用于下载
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);

            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = url;
            downloadArea.style.display = 'block';
            statusDiv.innerText = "转换成功！";

            // 清理内存
            if (videoInput) ffmpeg.FS('unlink', 'video.m4s');
            if (audioInput) ffmpeg.FS('unlink', 'audio.m4s');
            ffmpeg.FS('unlink', 'output.mp4');

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "发生错误，请查看浏览器控制台 (F12)。";
            statusDiv.style.color = "red";
        } finally {
            startBtn.disabled = false;
        }
    }
</script>

</body>
</html>
